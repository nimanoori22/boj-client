[package]
name = "boj-client"
version = "0.3.1"
edition = "2024"
license = "MIT"
description = "Rust client for the Bank of Japan time-series statistics API"
repository = "https://github.com/explorrrr/boj-client"
include = [
    "/src/**",
    "/Cargo.toml",
    "/README.md",
    "/README.en.md",
    "/LICENSE",
]

[dependencies]
csv = "1.4.0"
encoding_rs = "0.8.35"
flate2 = { version = "1.1.2", default-features = false, features = ["rust_backend"] }
rustopus = { git = "https://github.com/nimanoori22/rustopus", rev = "3d2b8120343e58b3ed7c92052c54700a164afa51" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
urlencoding = "2.1.3"

[dev-dependencies]
insta = { version = "1.43.2", features = ["yaml"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = "0.6.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[package.metadata.release]
allow-branch = ["master"]
consolidate-commits = true
pre-release-commit-message = "chore(release): {{version}}"
tag-name = "v{{version}}"
tag-message = "Release {{crate_name}} {{version}}"
publish = false
push = false
